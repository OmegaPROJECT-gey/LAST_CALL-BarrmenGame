[package]
name = "lc-lint"
version = "0.1.0"
edition = "2021"
description = "LAST CALL linters: design data schemas, dialogue graph, bilingual documentation pairs"
license = "MIT"
publish = false

[[bin]]
name = "lc-data-lint"
path = "src/bin/lc-data-lint.rs"

[[bin]]
name = "lc-dialogue-lint"
path = "src/bin/lc-dialogue-lint.rs"

[[bin]]
name = "lc-docs-check"
path = "src/bin/lc-docs-check.rs"

[dependencies]
serde_json = "1"
jsonschema = "0.26"
regex = "1"
