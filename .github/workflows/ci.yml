name: ci

# LAST CALL continuous integration.
# F0 gate (ROADMAP): design data schemas, dialogue graph + EN/RU parity,
# bilingual documentation pairs + link integrity.
# The Unreal build job lands with milestone F0's engine step: it needs an
# installed UE 5.8 (self-hosted runner or Epic's build containers) and is
# deliberately not faked here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools

      - name: Build linters
        run: cargo build --manifest-path tools/Cargo.toml

      - name: Validate design data against schemas
        run: ./tools/target/debug/lc-data-lint

      - name: Dialogue graph + EN/RU localization parity
        run: ./tools/target/debug/lc-dialogue-lint

      - name: Documentation pairs + link integrity
        run: ./tools/target/debug/lc-docs-check

  solver:
    # F1 groundwork: the pour solver core is engine-independent C++17,
    # so its unit tests run before UE 5.8 is installed (ARCHITECTURE 10).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pour solver unit tests
        run: ./scripts/test-pour-solver.sh

      - name: Customer reaction unit tests
        run: ./scripts/test-customer-reaction.sh

      - name: Day schedule (phase clock) unit tests
        run: ./scripts/test-day-schedule.sh

      - name: Save state unit tests
        run: ./scripts/test-save-state.sh

      - name: Order + consequence log unit tests (F3 cores)
        run: ./scripts/test-order.sh

      - name: Minimal JSON reader unit tests
        run: ./scripts/test-json.sh

      - name: Recipe library unit tests (data -> solver)
        run: ./scripts/test-recipes.sh

      - name: Dialogue runner unit tests (data -> world)
        run: ./scripts/test-dialogue.sh

      - name: Skill tree unit tests (data -> wallet)
        run: ./scripts/test-skills.sh

      - name: Liquid core unit tests (layering -> solver)
        run: ./scripts/test-liquids.sh

      - name: Economy core unit tests (suppliers -> ledger)
        run: ./scripts/test-economy.sh

      - name: Customer library unit tests (personas -> threat)
        run: ./scripts/test-customer-library.sh

      - name: Social consequences unit tests (flags -> standing)
        run: ./scripts/test-social.sh

      - name: Crafting unit tests (inputs -> outcomes)
        run: ./scripts/test-crafting.sh

      - name: Destructibility unit tests (roles -> durability)
        run: ./scripts/test-interactions.sh

      - name: Night mode unit tests (gating -> death consequences)
        run: ./scripts/test-night.sh

      - name: Orders to go unit tests (queue -> pressure)
        run: ./scripts/test-togo.sh

      - name: Debt runs unit tests (approaches -> outcomes)
        run: ./scripts/test-debt.sh

      - name: Raid director unit tests (evidence -> heat/fines)
        run: ./scripts/test-raid.sh

      - name: Investigations unit tests (tokens -> intel)
        run: ./scripts/test-intel.sh
